services:
  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: blog-cms
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27019:27017"
    networks:
      - blog_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Payload CMS ───────────────────────────────────────────────────────────────
  cms:
    build:
      context: ./cms
      dockerfile: Dockerfile
      args:
        PAYLOAD_SECRET: ${PAYLOAD_SECRET:-change-me}
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - ./cms/.env
    environment:
      DATABASE_URI: mongodb://mongodb:27017/blog-cms
      PORT: "4201"
    volumes:
      - cms_uploads:/app/uploads
    ports:
      - "4201:4201"
    networks:
      - blog_network

  # ── Nuxt Blog ─────────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - cms
    env_file:
      - .env
    environment:
      NUXT_PAYLOAD_URL: http://cms:4201
      PAYLOAD_URL: http://cms:4201
      # Empty = proxy mode: client-side CMS calls go to same-origin /api/*,
      # and the Nuxt server proxies to the internal CMS container (cms:4201).
      NUXT_PUBLIC_PAYLOAD_URL: ""
    ports:
      - "4200:4100"
    networks:
      - blog_network

volumes:
  mongodb_data:
  cms_uploads:

networks:
  blog_network:
    driver: bridge
