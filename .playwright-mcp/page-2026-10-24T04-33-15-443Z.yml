                - heading "Server Setup and Deploy" [level=3] [ref=f4e152]
                - paragraph [ref=f4e153]:
                  - text: My goal is to deploy these websites to a self-hosted
                  - link "Raspberry Pi 5" [ref=f4e154] [cursor=pointer]:
                    - /url: https://www.raspberrypi.com/products/raspberry-pi-5/
                  - text: . This will reduce long-term cloud costs, such as DigitalOcean, and help me learn more about server management.
                - paragraph [ref=f4e155]:
                  - text: For deployment, I set everything up with
                  - link "Docker Compose" [ref=f4e156] [cursor=pointer]:
                    - /url: https://docs.docker.com/compose/
                  - text: . Docker Compose lets me build and validate locally before deploying to the server, which is a huge advantage. It means I can replicate a production-like environment, iterate faster, and reduce the risk of downtime or performance issues on the live server.
                - paragraph [ref=f4e157]:
                  - text: After deploying the websites to my Raspberry Pi 5, I set up
                  - link "Cloudflare Tunnel" [ref=f4e158] [cursor=pointer]:
                    - /url: https://developers.cloudflare.com/tunnel/
                  - text: to expose the applications to the internet and configured my DNS records in Cloudflare. I also set up
                  - link "Access Control" [ref=f4e159] [cursor=pointer]:
                    - /url: https://developers.cloudflare.com/cloudflare-one/access-controls/
                  - text: from Cloudflare to restrict unauthorized access to sensitive URLs, such as
                  - code [ref=f4e160]: /admin
                  - text: .
                - paragraph [ref=f4e161]: "In the end, there are a few endpoints:"
                - list [ref=f4e162]:
                  - listitem [ref=f4e163]:
                    - code [ref=f4e164]: https://jacky.fan
                    - text: → Personal Website
                  - listitem [ref=f4e165]:
                    - code [ref=f4e166]: https://cms.jacky.fan
                    - text: → CMS for Personal Website
                  - listitem [ref=f4e167]:
                    - code [ref=f4e168]: https://blog.jacky.fan
                    - text: → Blog Website
                  - listitem [ref=f4e169]:
                    - code [ref=f4e170]: https://cms-blog.jacky.fan
                    - text: → CMS for Blog Website
                - paragraph
                - heading "Data Migration" [level=3] [ref=f4e171]
                - paragraph [ref=f4e172]: For data migration, I wanted to review my content as well, so I chose to migrate manually by copying and pasting it into the CMS. It was also a good chance to review the CMS and website features and spot any bugs so I could fix them immediately.
                - paragraph
                - heading "Wrap-up" [level=2] [ref=f4e173]
                - list [ref=f4e174]:
                  - listitem [ref=f4e175]: Migrated two websites — Jacky.Fan and blog.jacky.fan — from Strapi and Nuxt Markdown to Payload CMS
                  - listitem [ref=f4e176]: "Payload's code-first approach and Live Preview resolved the main pain points: no more blind editing or manual Markdown/image wrangling"
                  - listitem [ref=f4e177]: GitHub Copilot accelerated development, particularly where existing schema (Strapi config or Markdown frontmatter) was available to reference
                  - listitem [ref=f4e178]: Switched from the Cloud Agent to VSCode Copilot Chat for fine-tuning — the monorepo structure helped the agent navigate the full stack more effectively
                  - listitem [ref=f4e179]: Docker Compose enabled full local testing before touching the live server, reducing risk of downtime
                  - listitem [ref=f4e180]:
                    - text: Cloudflare Tunnel and Access Control handled public exposure and restricted sensitive URLs (e.g.
                    - code [ref=f4e181]: /admin
                    - text: ) without relying on a cloud provider
                  - listitem [ref=f4e182]: Manual data migration doubled as a QA pass, surfacing bugs early before launch
                  - listitem [ref=f4e183]: "End result: a cleaner, more maintainable setup across both sites with a content editing workflow that is actually pleasant to use"
