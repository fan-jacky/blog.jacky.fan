            - heading "I migrated my websites into Payload CMS" [level=1] [ref=f4e29]
            - paragraph [ref=f4e30]: A hands‑on walkthrough of migrating two personal sites to Payload CMS, highlighting code‑first development, live preview, and how GitHub Copilot streamlined the process.
            - generic [ref=f4e31]:
              - generic [ref=f4e32]: June 15, 2026
              - generic [ref=f4e33]: ·
              - generic [ref=f4e34]: Jacky FAN
              - generic [ref=f4e35]: ·
              - generic [ref=f4e36]: 5 min read
          - generic [ref=f4e37]:
            - generic [ref=f4e38]:
              - generic [ref=f4e39]:
                - heading "Overview" [level=2] [ref=f4e40]
                - paragraph [ref=f4e41]:
                  - text: I have recently migrate two of my websites into using Payload CMS. One of it is my personal website
                  - link "Jacky.Fan" [ref=f4e42] [cursor=pointer]:
                    - /url: https://jacky.fan/
                  - text: ", and the other is my"
                  - link "blog website" [ref=f4e43] [cursor=pointer]:
                    - /url: https://blog.jacky.fan/
                  - text: .
                - paragraph
                - heading "Why Payload" [level=3] [ref=f4e44]
                - paragraph [ref=f4e45]:
                  - link "Payload" [ref=f4e46] [cursor=pointer]:
                    - /url: https://payloadcms.com/
                  - text: is an open-source, code-first headless CMS built with TypeScript and Node.js. Instead of clicking around to define content types, you describe your schema, business logic, and admin UI directly in code, which made it feel much closer to “building contents” than “configuring a CMS.”
                - paragraph [ref=f4e47]: Because it is headless, the front end stays completely decoupled. I can keep my site in whatever framework I want, and just pull content over Payload’s REST APIs. On the data side, it runs on infrastructure I control, with MongoDB or PostgreSQL as the database.
                - paragraph [ref=f4e48]: One feature I ended up relying on more than I expected was Live Preview. With draft or preview mode turned on, I can see unpublished edits render on the real site instantly while I write, without hitting publish. That feedback loop made migrating and iterating on the new setup noticeably faster.
                - paragraph
                - heading "What changed from the old setup" [level=3] [ref=f4e49]
                - paragraph [ref=f4e50]:
                  - text: For my personal website,
                  - link "Jacky.Fan" [ref=f4e51] [cursor=pointer]:
                    - /url: http://Jacky.Fan
                  - text: ", I had been using"
                  - link "Strapi CMS" [ref=f4e52] [cursor=pointer]:
                    - /url: https://strapi.io/
                  - text: since 2024. However, it was not a good experience. At the time, Strapi CMS did not have Live Preview, so I could not preview content while editing. Also, The integration I implemented was not well‑developed. In the end, I stopped using it to manage CMS content.
                - paragraph [ref=f4e53]: For my blog website, I was using the built-in markdown rendering features in Nuxt 3. I wrote blog posts in the Notion app, then converted the content and images into Markdown. I also had to make sure all image URLs were uploaded to my GitHub repo and linked correctly. Overall, it was a complex workflow.
                - paragraph
                - heading "The Coding Part" [level=2] [ref=f4e54]
                - paragraph [ref=f4e55]: In this migration, I aimed to simplify my development workflow. As a result, I chose to implement most of the code using GitHub Copilot.
                - paragraph
                - heading "Developing with Github Copilot" [level=3] [ref=f4e56]
                - paragraph [ref=f4e57]:
                  - text: At first, I used the new
                  - link "Github Copilot Cloud Agent" [ref=f4e58] [cursor=pointer]:
                    - /url: https://docs.github.com/en/copilot/concepts/agents/cloud-agent/about-cloud-agent
                  - text: for the initial coding tasks. However, I noticed that the results were not ideal, and it was difficult to fine-tune them without reading the code. So I switched to VSCode’s Github Copilot Chat for the rest of the development.
                - paragraph
                - figure "Developing with Github Copilot" [ref=f4e59]:
                  - 'button "Open full size image: Developing with Github Copilot"':
                    - img "Developing with Github Copilot"
                - paragraph
                - paragraph
                - heading "CMS Scheme" [level=3] [ref=f4e61]
                - paragraph [ref=f4e62]: My personal website originally used Strapi CMS, and it already had a well-defined schema. That made it easy for GitHub Copilot to read the schema from the code and adapt it for Payload CMS.
                - paragraph [ref=f4e63]: For example, GitHub Copilot brought over collections, fields, and components from Strapi into Payload.
                - figure "CMS Scheme created by Github Copilot" [ref=f4e64]:
                  - 'button "Open full size image: CMS Scheme created by Github Copilot"':
                    - img "CMS Scheme created by Github Copilot"
                - paragraph
                - figure "CMS Components created by Github Copilot" [ref=f4e66]:
                  - 'button "Open full size image: CMS Components created by Github Copilot"':
                    - img "CMS Components created by Github Copilot"
                - paragraph
                - paragraph [ref=f4e68]: For my blog website, there was no CMS logic in the original code. However, the Markdown post files had well-defined header fields. As a result, GitHub Copilot could still infer the field structure from those files and create the appropriate CMS structure for integration.
                - figure "Original Markdown Posts Files" [ref=f4e69]:
                  - 'button "Open full size image: Original Markdown Posts Files"':
                    - img "Original Markdown Posts Files"
                - paragraph
                - figure "CMS Structure created by Github Copilot" [ref=f4e71]:
                  - 'button "Open full size image: CMS Structure created by Github Copilot"':
                    - img "CMS Structure created by Github Copilot"
                - paragraph
                - paragraph
                - heading "Project Structure" [level=3] [ref=f4e73]
                - paragraph [ref=f4e74]:
                  - text: Although the two projects use different frameworks (
                  - link "Next.js" [ref=f4e75] [cursor=pointer]:
                    - /url: https://nextjs.org/
                  - text: and
                  - link "Nuxt.js" [ref=f4e76] [cursor=pointer]:
                    - /url: https://nuxt.com/
                  - text: ), they share the same overall structure. The framework code sits at the root, and the Payload CMS code lives in the
                  - code [ref=f4e77]: cms
                  - text: folder.
                - paragraph [ref=f4e78]: The main reason for this structure is to make it easier for the coding agent to understand the codebase. By keeping both the frontend and CMS code in the same repo, the agent can search across the entire project and build better context, which helps with more complicated tasks.
                - paragraph
